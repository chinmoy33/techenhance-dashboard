services:
  core-service:
    build:
      context: ./backend
      dockerfile: core-service/Dockerfile
    working_dir: /app
    env_file: ./backend/core-service/.env
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - RECOMMENDATION_URL=http://recommendation-service:3002
    depends_on:
      - recommendation-service
    volumes:
      - ./backend/core-service:/app
      - ./backend/shared:/app/shared
    command: ["npm", "run", "dev"] # Assumes you have a "dev" script with nodemon

  recommendation-service:
    build:
      context: ./backend
      dockerfile: recommendation-service/Dockerfile
    working_dir: /app
    env_file: ./backend/recommendation-service/.env
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    volumes:
      - ./backend/recommendation-service:/app
      - ./backend/shared:/app/shared
    command: ["npm", "run", "dev"] # Assumes you have a "dev" script with nodemon

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: ./frontend/.env
    ports:
      - "3000:3000" # Changed to match dev server port
    environment:
      - REACT_APP_CORE_API=http://core-service:3001
      - REACT_APP_RECOMMENDATION_API=http://recommendation-service:3002
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent overwriting node_modules
    command: ["npm", "start"] # Use development server
